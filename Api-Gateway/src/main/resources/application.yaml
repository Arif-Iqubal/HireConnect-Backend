server:
    port: 8080

spring:
  application:
        name: api-gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka


springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: Profile Service
        url: /profile/v3/api-docs
      - name: Job Service
        url: /job/v3/api-docs
      - name: Application Service
        url: /application/v3/api-docs