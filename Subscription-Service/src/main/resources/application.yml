server:
  port: 8087

spring:
  application:
    name: SUBSCRIPTION-SERVICE
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/subscription_db
    username: ${DB_USERNAME:root} 
    password: ${DB_PASSWORD:Arif@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:HireConnect2024SecretKeyForJWTTokenValidationMustBe256BitsLong}
  subscription:
    plans:
      free:
        max-job-posts: 3
        price: 0.0
      professional:
        max-job-posts: 50
        price: 1999.0
        duration-days: 30
      enterprise:
        max-job-posts: 999
        price: 4999.0
        duration-days: 30

logging:
  level:
    com.hireconnect: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
